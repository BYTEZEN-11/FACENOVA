# Redis configuration for development / production.
# Reads password from env (REDIS_PASSWORD) at container start; see docker-compose.

# Bind to all interfaces inside the Docker network. Production deployments
# should NOT publish 6379 to the host (handled in docker-compose).
bind 0.0.0.0

# Enable protected mode (refuses unknown clients when no password is set,
# or when bind exposes the service on a public interface).
protected-mode yes

# Auth is required. The env var must be set; we fail-fast at startup if missing.
# `requirepass` line is templated below and replaced by docker-compose command
# (see `command:` override).

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Logging
loglevel notice

# Performance tuning
tcp-keepalive 60
timeout 300
